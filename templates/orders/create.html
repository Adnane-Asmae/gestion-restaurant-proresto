<h1>Créer une commande 🍽️</h1>

<form method="POST">

    {% csrf_token %}

    <label>Table :</label>
    <select name="table">

        {% for table in tables %}
            <option value="{{ table.id }}">
                Table {{ table.numero }}
            </option>
        {% endfor %}

    </select>

    <br><br>

    <label>Client :</label>
    <select name="client">

        {% for client in clients %}
            <option value="{{ client.id }}">
                {{ client.username }}
            </option>
        {% endfor %}

    </select>

    <br><br>

    <label>Plats :</label>

    {% for plat in plats %}

        <div>
            <input
                type="checkbox"
                name="plats"
                value="{{ plat.id }}"
            >

            {{ plat.nom }} - {{ plat.prix }} DH
        </div>

    {% endfor %}

    <br>

    <button type="submit">
        Créer la commande
    </button>

</form>
